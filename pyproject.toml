[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-coding-agent-local"
version = "0.1.0"
description = "Minimal local coding agent with independent evaluation"
requires-python = ">=3.10"
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
mini-coding-agent = "coding_agent.cli:main"
mini-coding-agent-evaluate = "benchmarks.evaluate:main"

[tool.setuptools.packages.find]
include = ["coding_agent*", "benchmarks"]
namespaces = false

[tool.setuptools.package-data]
benchmarks = ["tasks/**/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: requires local Ollama model"]
